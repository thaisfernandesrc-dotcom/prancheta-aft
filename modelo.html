<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prancheta de Inspeção</title>
<style>
:root{
  --fundo:#f4f6f9; --cartao:#ffffff; --texto:#17202b; --suave:#5b6878; --linha:#d9dfe7;
  --azul:#1e4c8a; --azul-claro:#e8f0fb;
  --regular:#1f7a46; --regular-f:#e3f4ea;
  --irregular:#b3261e; --irregular-f:#fbe7e5;
  --nv:#6b7280; --nv-f:#eef0f3;
  --na:#475569; --na-f:#e9eef5;
  --doc:#7a4b00; --doc-f:#fff3dc;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fundo);color:var(--texto);
  font:16px/1.45 Roboto,"Segoe UI",Arial,sans-serif;-webkit-text-size-adjust:100%}
body{padding:0 0 104px}
header{position:sticky;top:0;z-index:5;background:var(--azul);color:#fff;padding:6px 16px 5px}
header h1{margin:0;font-size:14px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header h1 b{font-weight:700}
.barra{height:4px;background:rgba(255,255,255,.25);border-radius:2px;margin-top:5px;overflow:hidden}
.barra i{display:block;height:100%;background:#7fd3a2;width:0}
.contagem{font-size:11.5px;margin-top:3px;opacity:.95;line-height:1.3}
main{max-width:760px;margin:0 auto;padding:12px 16px}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--suave);margin:24px 0 8px}
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0}
.filtros button{border:1px solid var(--linha);background:var(--cartao);border-radius:999px;padding:6px 12px;font-size:14px;color:var(--texto)}
.filtros button[aria-pressed="true"]{background:var(--azul);border-color:var(--azul);color:#fff}
.cartao{background:var(--cartao);border:1px solid var(--linha);border-left:5px solid var(--linha);border-radius:10px;padding:12px;margin:10px 0}
.cartao[data-sit="regular"]{border-left-color:var(--regular)}
.cartao[data-sit="irregular"]{border-left-color:var(--irregular)}
.cartao[data-sit="nao_verificado"]{border-left-color:var(--nv)}
.cartao[data-sit="nao_aplicavel"]{border-left-color:var(--na)}
.cod{font-weight:700;color:var(--azul);font-size:15px}
.grupo{font-size:12px;color:var(--suave);margin-left:6px}
.topo{display:flex;align-items:flex-start;gap:8px}
.topo .tit{flex:1;min-width:0}
.duvida{flex:none;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--linha);background:#fff;color:var(--suave);font-weight:800;font-size:17px;line-height:1;cursor:pointer}
.duvida[aria-pressed="true"]{background:#ffe7a8;border-color:#d99a00;color:#7a5200}
.marca-duvida{display:inline-block;font-size:12px;font-weight:700;color:#7a5200;background:#fff3cf;border-radius:999px;padding:1px 8px;margin-left:6px}
.cartao[data-duvida="true"]{box-shadow:inset 0 0 0 2px #f2c14e}
.tipos{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px;align-items:center}
.tipos .rot2{font-size:12px;color:var(--suave);margin-right:2px}
.tipos button{border:1px solid var(--linha);background:#fff;border-radius:999px;padding:4px 10px;font-size:13px;color:var(--texto);min-height:32px;cursor:pointer}
.tipos button[aria-pressed="true"]{background:var(--azul);border-color:var(--azul);color:#fff}
.tipos button[data-v="documental"][aria-pressed="true"]{background:var(--doc);border-color:var(--doc)}
.quando{font-size:12px;color:var(--suave);margin-top:2px}
.desc{margin:4px 0 8px;font-size:14.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.desc.aberta{display:block}
.sits{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:8px}
.sits button{min-height:34px;border-radius:7px;border:1.5px solid var(--linha);background:#fff;font-size:13px;font-weight:600;color:var(--texto);padding:3px 5px}
.sits button[data-v="regular"][aria-pressed="true"]{background:var(--regular-f);border-color:var(--regular);color:var(--regular)}
.sits button[data-v="irregular"][aria-pressed="true"]{background:var(--irregular-f);border-color:var(--irregular);color:var(--irregular)}
.sits button[data-v="nao_verificado"][aria-pressed="true"]{background:var(--nv-f);border-color:var(--nv);color:var(--nv)}
.sits button[data-v="nao_aplicavel"][aria-pressed="true"]{background:var(--na-f);border-color:var(--na);color:var(--na)}
.desfechos{margin-top:10px;border-top:1px dashed var(--linha);padding-top:8px}
.desfechos .rot2{font-size:12px;color:var(--suave);display:block;margin-bottom:6px}
.desfechos .grade{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}
.desfechos button.desf-toggle{display:block;width:100%;min-height:32px;border:0;background:none;padding:2px 0;font-size:12.5px;font-weight:400;color:var(--suave);text-align:left;cursor:pointer}
.desf-toggle .seta{display:inline-block;width:1.1em;color:var(--azul);font-size:15px;font-weight:700}
.desf-toggle b{color:var(--azul);font-weight:600}
.desfechos button{min-height:30px;border-radius:7px;border:1.5px solid var(--linha);background:#fff;font-size:12px;font-weight:600;color:var(--texto);line-height:1.15;padding:3px 5px}
.desfechos button small{display:block;font-size:10px;font-weight:400}
.desfechos button[aria-pressed="true"]{background:var(--azul-claro);border-color:var(--azul);color:var(--azul)}
.desfechos button[data-v="regularizado"][aria-pressed="true"]{background:var(--regular-f);border-color:var(--regular);color:var(--regular)}
.desfechos button[data-v="embargo"][aria-pressed="true"],.desfechos button[data-v="interdicao"][aria-pressed="true"]{background:var(--irregular-f);border-color:var(--irregular);color:var(--irregular)}
label.rot{display:block;font-size:13px;color:var(--suave);margin:10px 0 4px}
textarea,input[type=text]{width:100%;border:1px solid var(--linha);border-radius:8px;padding:10px;font:inherit;font-size:15px;background:#fff;color:var(--texto)}
textarea{min-height:76px;resize:vertical}
textarea.info-gerais{min-height:130px;max-height:60vh;field-sizing:content}
.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{min-height:44px;border-radius:8px;border:1px solid var(--azul);background:#fff;color:var(--azul);padding:0 14px;font-size:14.5px;font-weight:600;cursor:pointer}
.btn.cheio{background:var(--azul);color:#fff}
.btn.perigo{border-color:var(--irregular);color:var(--irregular)}
.btn.link{border:0;background:none;padding:0 4px;min-height:32px;text-decoration:underline}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;margin-top:10px}
.fotos figure{margin:0}
.fotos img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px;border:1px solid var(--linha);display:block;cursor:pointer}
.fotos figcaption{font-size:11px;color:var(--suave);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.docs{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.doc{display:flex;align-items:center;gap:8px;border:1px solid var(--linha);border-radius:8px;padding:8px 10px;background:#fbfcfe}
.doc .nome{flex:1;min-width:0;font-size:14px;color:var(--azul);text-decoration:underline;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;border:0;text-align:left;padding:0}
.doc .tam{font-size:12px;color:var(--suave);flex:none}
.doc .tirar{flex:none;border:0;background:none;color:var(--irregular);font-size:20px;line-height:1;cursor:pointer;padding:0 4px}
.enq{margin-top:10px;background:var(--azul-claro);border:1px solid #c4d6f0;border-radius:8px;padding:10px;font-size:14px}
.enq b{color:var(--azul)}
.enq .desc{margin:4px 0 0}
.linha-ementa{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.linha-ementa .rot3{font-size:13px;color:var(--azul);font-weight:700}
.enq input.cod-ementa{flex:1;min-width:8.5em;padding:6px 8px;font-weight:700;color:var(--azul);font-size:15px}
.sugestoes{margin-top:6px;max-height:55vh;overflow-y:auto;border:1px solid #c4d6f0;border-radius:8px;background:#fff}
.sugestoes .sug{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--linha);background:#fff;padding:8px 10px;font:inherit;font-size:13.5px;color:var(--texto);cursor:pointer}
.sugestoes .sug:active{background:var(--azul-claro)}
.sugestoes .sug b{color:var(--azul)}
.sugestoes .sug span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.sugestoes .sug-vazio{padding:8px 10px;font-size:13px;color:var(--suave)}
.enq .alerta{color:var(--irregular)}
.enq .cap{font-size:12.5px;color:var(--suave);margin-top:4px}
.aviso{background:#fff4d6;border:1px solid #f0d58a;border-radius:8px;padding:10px;font-size:14px;margin:10px 0}
.rodape{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--linha);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center}
.rodape .status{flex:1;font-size:12.5px;color:var(--suave);line-height:1.3}
.rodape .btn{flex:none}
dialog{border:0;border-radius:12px;padding:0;max-width:96vw;width:640px}
dialog img{width:100%;display:block}
dialog .corpo{padding:12px}
#camera{position:fixed;inset:0;z-index:20;background:#000;display:flex;flex-direction:column}
#camera[hidden]{display:none}
#camera video{flex:1;min-height:0;width:100%;object-fit:contain;background:#000}
#camera .cam-topo{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;color:#fff;font-size:15px;background:linear-gradient(rgba(0,0,0,.6),transparent)}
#camera .cam-btn{border:1px solid rgba(255,255,255,.75);background:rgba(0,0,0,.35);color:#fff;border-radius:999px;padding:8px 16px;font-size:15px;font-weight:700;cursor:pointer}
#camera .cam-btn[aria-pressed="true"]{background:#ffd54a;color:#000;border-color:#ffd54a}
#camera .cam-barra{flex:none;display:flex;align-items:center;justify-content:space-between;padding:16px 22px calc(16px + env(safe-area-inset-bottom));background:#000}
#camera .disparo{width:78px;height:78px;border-radius:50%;border:5px solid #fff;background:#fff;box-shadow:inset 0 0 0 3px #000;cursor:pointer}
#camera .disparo:active{transform:scale(.92)}
#camera .miniatura{width:58px;height:58px;border-radius:8px;border:2px solid #fff;background:#222 center/cover no-repeat}
#camera .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .18s}
#camera .flash.on{opacity:.75;transition:none}
.vazio{color:var(--suave);font-size:14px;margin:6px 0}
.indicio-novo{display:flex;gap:8px;align-items:stretch}
.indicio-novo input{flex:1}
.indicios{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.indicio{display:flex;gap:6px;align-items:flex-start;background:#fffbea;border:1px solid #f0d58a;border-left:4px solid #d9a400;border-radius:8px;padding:6px}
.indicio textarea{min-height:44px;flex:1;border:0;background:transparent;padding:6px;field-sizing:content}
.ind-mais,.ind-tirar{flex:none;width:44px;height:44px;border-radius:8px;font-size:22px;font-weight:700;cursor:pointer;line-height:1}
.ind-mais{border:1px solid var(--irregular);background:var(--irregular);color:#fff}
.ind-tirar{border:1px solid var(--linha);background:#fff;color:var(--suave)}
.ind-fotos{flex:none;align-self:center;font-size:13px;color:var(--suave);white-space:nowrap}
.visor-copiar{min-height:40px;border:1px solid var(--linha);border-radius:8px;background:#fff;color:var(--texto);font:inherit;font-size:14px;padding:4px 6px;flex:1;min-width:0;width:100%}
.foto-b{cursor:pointer}
.foto-b.sel{outline:3px solid var(--azul);outline-offset:-1px;background:var(--azul-claro)}
.foto-b .ja-em{font-size:11.5px;color:var(--regular);line-height:1.25}
.bandeja-todas{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 6px;font-size:14px;color:var(--suave)}
.bandeja{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:8px}
.foto-b{margin:0;background:var(--cartao);border:1px solid var(--linha);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:5px}
.foto-b img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;background:var(--fundo)}
.foto-b figcaption{font-size:12px;color:var(--suave)}
.foto-b select,.bandeja-todas select{min-height:40px;border:1px solid var(--linha);border-radius:8px;background:#fff;color:var(--texto);font:inherit;font-size:14px;padding:4px 6px;flex:1;min-width:0;width:100%}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#17202b;color:#fff;padding:10px 14px;border-radius:8px;font-size:14px;z-index:9;max-width:90vw}
details.config{margin-top:14px;font-size:14px}
details.config summary{color:var(--suave);cursor:pointer}
</style>
</head>

    <span><button class="cam-btn" type="button" id="cam-lanterna" aria-pressed="false" hidden>🔦</button>
    <button class="cam-btn" type="button" id="cam-pronto">Pronto</button></span></div>
  <div class="cam-barra"><div class="miniatura" id="cam-mini"></div>
    <button class="disparo" type="button" id="cam-disparo" aria-label="Tirar foto"></button><span style="width:58px"></span></div>
</div>

<script>
(function () {
"use strict";
// Prancheta de Inspeção (skill minha-prancheta). Serve à fiscalização inteira:
// inspeção física (celular) e auditoria documental (computador). Nada vai a
// servidor nenhum. Os dados ficam DENTRO deste arquivo (bloco dados-prancheta)
// e, enquanto se trabalha, também no navegador do aparelho.
//
// Junção item a item: cada item guarda "atualizado_em"; o enquadramento tem a
// própria hora ("em_iso"); item apagado fica marcado ("apagado"), não some.
// Assim celular, computador e o script do assistente podem mexer no mesmo
// arquivo sem que a versão de um apague o trabalho do outro.
var MARCA = '<script id="dados-prancheta" type="application/json">';
var PRISTINE = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
var estado;
try { estado = JSON.parse(document.getElementById("dados-prancheta").textContent || "{}"); }
catch (e) { estado = {}; }
normalizar(estado);
var SITS = [["regular", "Regular"], ["irregular", "Irregular"],
            ["nao_verificado", "Não verificado"], ["nao_aplicavel", "Não aplicável"]];
// Desfecho do item irregular, com as opções do SFIT-WEB. Pode haver mais de um
// (ex.: interdição e autuado; depois levantamento e regularizado). Cada um
// guarda a data em que foi marcado.
var DESFECHOS = [["autuado", "Autuado"], ["regularizado", "Regularizado"],
                 ["embargo", "Embargo"], ["lev_embargo", "Levantamento de Embargo"],
                 ["interdicao", "Interdição"], ["lev_interdicao", "Levantamento de Interdição"]];
var TIPOS = {os: "OS", inspecao: "Inspeção física", documental: "Análise documental"};
var TIPOS_CURTO = {os: "OS", inspecao: "Inspeção", documental: "Documental"};   // cabe numa linha no celular
var filtro = "todas";
var desfAberto = {};   // cartões com o Desfecho aberto (só nesta tela; começa fechado)
var app = document.getElementById("app");
var guardaAparelho = "idb";         // idb | local (só texto) | nenhum
var arquivoHandle = null;           // computador: o arquivo da pasta da OS
var arquivoPermitido = false;
var salvoNoArquivoEm = null, exportadoEm = null, gravadoEm = null;
var alteradoDepoisDeSalvar = false;
// Celular usa sempre "Salvar arquivo" → compartilhar → OneDrive. O Chrome do
// Android também tem a gravação direta, mas ela não foi testada com o OneDrive;
// por isso só o computador grava direto no arquivo da pasta da OS.
var EH_CELULAR = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || "")
  || !!(navigator.userAgentData && navigator.userAgentData.mobile);
var PODE_GRAVAR_DIRETO = typeof window.showSaveFilePicker === "function" && !EH_CELULAR;
// Sincronizar (TESTE no celular, pedido da AFT em 14/10/2026): no celular a
// gravação direta fica só no toque do botão, nunca sozinha a cada mudança.
var SINCRONIA_CELULAR = EH_CELULAR;

function normalizar(s) {
  s.itens = s.itens || []; s.observacoes = s.observacoes || ""; s.carimbo = s.carimbo || {};
  s.indicios = Array.isArray(s.indicios) ? s.indicios : [];
  s.indicios.forEach(function (x) { x.fotos = x.fotos || []; });
  s.bandeja = Array.isArray(s.bandeja) ? s.bandeja : [];
  s.itens.forEach(function (it) {
    // tipo: "os" (padrão das ementas da OS), "inspecao" ou "documental"
    if (!it.tipo) it.tipo = it.origem === "os" ? (it.fase || "os") : (it.fase || "inspecao");
    delete it.fase;
    it.duvida = !!it.duvida;
    it.fotos = it.fotos || [];
    it.documentos = it.documentos || [];
    if (!it.desfechos || typeof it.desfechos !== "object") it.desfechos = {};
    // Ementa que a AFT digitou numa constatação é DEFINITIVA, como a da OS (pedido
    // da AFT, 14/10/2026): fica no próprio item, não como "enquadramento".
    var en = it.enquadramento;
    if (it.origem !== "os" && en && en.por === "AFT" && en.codigo && (!it.codigo || it.codigo === en.codigo)) {
      it.codigo = en.codigo; it.gradacao = en.gradacao || it.gradacao || ""; it.descricao = en.descricao || it.descricao || "";
      it.capitulacao = en.capitulacao || it.capitulacao || ""; it.ementa_por = "AFT"; it.ementa_em = en.em || it.ementa_em || "";
      it.enquadramento = null;
    }
  });
  return s;
}
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
  return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]; }); }
function dois(n) { return (n < 10 ? "0" : "") + n; }
function fmtData(d) { return dois(d.getDate()) + "/" + dois(d.getMonth() + 1) + "/" + d.getFullYear()
  + " " + dois(d.getHours()) + ":" + dois(d.getMinutes()); }
function hoje() { var d = new Date(); return dois(d.getDate()) + "/" + dois(d.getMonth() + 1) + "/" + d.getFullYear(); }
function hhmm(d) { return dois(d.getHours()) + ":" + dois(d.getMinutes()); }
function agoraIso() { return new Date().toISOString(); }
function ts(x) { var t = x ? Date.parse(x) : NaN; return isNaN(t) ? 0 : t; }
function chave() { return "prancheta|" + (estado.os || "") + "|" + (estado.ri || ""); }
function toast(t, ms) { var el = document.createElement("div"); el.className = "toast"; el.textContent = t;
  document.body.appendChild(el); setTimeout(function () { el.remove(); }, ms || 2600); }
function item(id) { for (var i = 0; i < estado.itens.length; i++) if (estado.itens[i].id === id) return estado.itens[i]; return null; }
function copia(x) { return JSON.parse(JSON.stringify(x)); }

// ------------------------------------------------------------ junção
function mesclar(a, b) {
  var r = copia(ts(a.salvo_em) >= ts(b.salvo_em) ? a : b);
  var mapa = {}, ordem = [];
  [a, b].forEach(function (s) { (s.itens || []).forEach(function (it) {
    if (!mapa[it.id]) { mapa[it.id] = []; ordem.push(it.id); } mapa[it.id].push(it); }); });
  r.itens = ordem.map(function (id) {

function desenharCarimbo(ctx, W, H, quando) {

  ctx.shadowColor = "transparent"; ctx.shadowBlur = 0;

  var wLogo = LOGO_AFT.naturalHeight ? hLogo * LOGO_AFT.naturalWidth / LOGO_AFT.naturalHeight : 0;
  if (wLogo) ctx.drawImage(LOGO_AFT, x0, topo, wLogo, hLogo);
  var xt = x0 + wLogo + 25 * k, largMax = W - xt - 20 * k;
  [c.titulo || "Registro Fotográfico de Inspeção", c.nome || "", c.cargo_cif || ""].forEach(function (t, i) {
    fonteQueCabe(ctx, t, "700", 29 * k, largMax);
    ctx.fillText(t, xt, topo + 33 * k + i * 38 * k);
  });
  var yb = H - 35 * k, dt = fmtData(quando);
  ctx.font = "700 " + (37 * k) + "px " + FONTE;
  ctx.fillText(dt, 20 * k, yb);
  var wDt = ctx.measureText(dt).width;
  var nome = String(c.estabelecimento || "").toUpperCase();
  var disp = W - 18 * k - (20 * k + wDt + 40 * k);
  var tam = fonteQueCabe(ctx, nome, "700", 37 * k, disp);
  ctx.textAlign = "right";
  if (tam < 22 * k) {
    ctx.font = "700 " + (30 * k) + "px " + FONTE;
    var palavras = nome.split(" "), l1 = "", l2 = "";
    palavras.forEach(function (p) { var teste = (l1 ? l1 + " " : "") + p;
      if (!l2 && ctx.measureText(teste).width <= W - 38 * k) l1 = teste; else l2 = (l2 ? l2 + " " : "") + p; });
    fonteQueCabe(ctx, l2, "700", 30 * k, W - 38 * k);
    ctx.fillText(l2, W - 18 * k, yb - 50 * k);
    fonteQueCabe(ctx, l1, "700", 30 * k, W - 38 * k);
    ctx.fillText(l1, W - 18 * k, yb - 88 * k);

    ctx.fillText(nome, W - 18 * k, yb);
  }

    if (!bruto) {

    }

    var x2 = ementario().ementas[c2];
    it.codigo = c2; it.gradacao = x2 ? x2[0] : ""; it.descricao = x2 ? x2[2] : ""; it.capitulacao = x2 ? x2[3] : "";

// da prancheta, como as fotos, sem carimbo. Limite por documento: 15 MB.
var LIMITE_DOC = 15 * 1024 * 1024;
function tamanhoTxt(n) { n = n || 0; return n >= 1048576 ? (n / 1048576).toFixed(1).replace(".", ",") + " MB" : Math.max(1, Math.round(n / 1024)) + " KB"; }
function lerComoDataUrl(arq) { return new Promise(function (ok, nao) {
  var r = new FileReader(); r.onload = function () { ok(r.result); }; r.onerror = function () { nao(r.error); }; r.readAsDataURL(arq); }); }
function escolherDocumento(id) {
  var inp = document.createElement("input");
  inp.type = "file"; inp.multiple = true;
  inp.accept = ".pdf,.jpg,.jpeg,.png,.webp,.heic,.doc,.docx,.xls,.xlsx,.odt,.ods,.csv,.txt,application/pdf,image/*";
  inp.onchange = function () {
    var it = item(id); if (!it || !inp.files.length) return;
    var fila = Array.prototype.slice.call(inp.files), grandes = [], p = Promise.resolve(), n = 0;
    fila.forEach(function (f) {
      if (f.size > LIMITE_DOC) { grandes.push(f.name + " (" + tamanhoTxt(f.size) + ")"); return; }
      p = p.then(function () { return lerComoDataUrl(f); }).then(function (url) {
        it.documentos.push({id: "a" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
          nome: f.name, tipo: f.type || "", tamanho: f.size, data: url, quando: fmtData(new Date())});
        n++; });
    });
    p.then(function () {
      if (n) { mudou(it); render(); }
      if (grandes.length) toast("Acima de 15 MB, não anexei: " + grandes.join(", ") + ". Guarde na pasta da OS e cite no campo Documento analisado.", 6000);
      else if (n) toast(n > 1 ? n + " documentos anexados." : "Documento anexado.");
    }).catch(function () { toast("Não consegui ler esse arquivo.", 3500); });
  };
  inp.click();
}
function abrirDocumento(d) {
  try {
    var partes = String(d.data).split(","), bin = atob(partes[1] || ""), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([bytes], {type: d.tipo || "application/octet-stream"}));
    var w = window.open(url, "_blank");
    if (!w) { var a = document.createElement("a"); a.href = url; a.download = d.nome; document.body.appendChild(a); a.click(); a.remove(); }
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
  } catch (e) { toast("Não consegui abrir esse documento.", 3500); }
}
// Câmera contínua (pedido da AFT, 14/10/2026: fotografar era lento, com botão,
// menu, câmera do celular e OK). O 📷 abre a câmera DENTRO da prancheta: cada
// toque no botão redondo tira a foto e já a carimba, sem sair da tela; tira-se
// várias seguidas e "Pronto" volta ao cartão. Sem câmera ou sem permissão, cai
// na câmera do celular, como antes. A galeria tem botão próprio no cartão.
var cam = {id: null, stream: null, n: 0, fila: Promise.resolve(), lanterna: false};
function abrirCamera(id) {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { escolherFoto(id, true); return; }
  navigator.mediaDevices.getUserMedia({audio: false,
    video: {facingMode: {ideal: "environment"}, width: {ideal: 1920}, height: {ideal: 1440}}})
    .then(function (s) {
      cam.id = id; cam.stream = s; cam.n = 0; cam.lanterna = false;
      var v = document.getElementById("cam-video"); v.srcObject = s;
      var p = v.play(); if (p && p.catch) p.catch(function () {});
      document.getElementById("cam-conta").textContent = "Toque no botão redondo para fotografar";
      document.getElementById("cam-mini").style.backgroundImage = "";
      var tr = s.getVideoTracks()[0], cap = tr && tr.getCapabilities ? tr.getCapabilities() : {};
      var lt = document.getElementById("cam-lanterna"); lt.hidden = !cap.torch; lt.setAttribute("aria-pressed", "false");
      document.getElementById("camera").hidden = false;
    })
    .catch(function () { toast("Sem acesso à câmera aqui: abrindo a câmera do celular.", 3000); escolherFoto(id, true); });
}
function fotografar() {
  var v = document.getElementById("cam-video");
  if (!cam.stream || !v.videoWidth) return;
  var c = document.createElement("canvas"); c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext("2d").drawImage(v, 0, 0);
  var quando = new Date(), fl = document.getElementById("cam-flash");
  fl.classList.add("on"); setTimeout(function () { fl.classList.remove("on"); }, 70);
  cam.n++; document.getElementById("cam-conta").textContent = cam.n + (cam.n > 1 ? " fotos" : " foto");
  var id = cam.id;
  cam.fila = cam.fila.then(function () { return logoPronto; }).then(function () {
    var it = item(id); if (!it) return;     // busca de novo: a junção pode ter trocado o estado
    var data = carimbar(c, quando);
    it.fotos.push({id: "f" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      data: data, quando: fmtData(quando), origem_hora: "agora", legenda: ""});
    document.getElementById("cam-mini").style.backgroundImage = 'url("' + data + '")';
    mudou(it);
  }).catch(function () { toast("Não consegui guardar a última foto. Tire de novo.", 3500); });
}
function fecharCamera() {
  if (cam.stream) cam.stream.getTracks().forEach(function (t) { t.stop(); });
  cam.stream = null; document.getElementById("cam-video").srcObject = null;
  document.getElementById("camera").hidden = true;
  var n = cam.n;
  cam.fila.then(function () { render(); if (n) toast(n > 1 ? n + " fotos carimbadas." : "Foto carimbada."); });
}
document.getElementById("cam-disparo").addEventListener("click", fotografar);
document.getElementById("cam-pronto").addEventListener("click", fecharCamera);
document.getElementById("cam-lanterna").addEventListener("click", function () {
  var tr = cam.stream && cam.stream.getVideoTracks()[0], bt = this; if (!tr) return;
  cam.lanterna = !cam.lanterna;
  tr.applyConstraints({advanced: [{torch: cam.lanterna}]})
    .then(function () { bt.setAttribute("aria-pressed", String(cam.lanterna)); })
    .catch(function () { cam.lanterna = !cam.lanterna; });
});
var visorAtual = null;
document.getElementById("visor-copiar").addEventListener("change", function () {
  var d = this.value; if (!d || !visorAtual) return;
  var n = copiarFotos([visorAtual.f], d);
  toast(n ? "Foto copiada para " + nomeDestino(d) + "." : "Essa foto já estava lá.", 3000);
  this.value = "";
});
function abrirVisor(it, fid) {
  var f = it.fotos.filter(function (x) { return x.id === fid; })[0]; if (!f) return;
  visorAtual = {it: it, f: f};
  document.getElementById("visor-img").src = f.data;
  document.getElementById("visor-legenda").value = f.legenda || "";
  document.getElementById("visor-copiar").innerHTML = '<option value="">escolha… (pode copiar para várias)</option>' + opcoesDestino(it.id);
  document.getElementById("visor").showModal();
}
document.getElementById("visor").addEventListener("click", function (ev) {
  var a = ev.target.closest("[data-acao]"); if (!a || !visorAtual) return;
  if (a.getAttribute("data-acao") === "visor-ok") {
    visorAtual.f.legenda = document.getElementById("visor-legenda").value; mudou(visorAtual.it);
  } else if (a.getAttribute("data-acao") === "visor-apagar") {
    if (!confirm("Apagar esta foto?")) return;
    var fid = visorAtual.f.id;
    visorAtual.it.fotos = visorAtual.it.fotos.map(function (x) { return x.id === fid ? {id: fid, apagado: true} : x; }); mudou(visorAtual.it);
  }
  document.getElementById("visor").close(); visorAtual = null; render();
});

// ------------------------------------------------------------ arquivo
function htmlCom(s) {
  var json = JSON.stringify(semInternos(s)).replace(/<\//g, "<\\/");
  var corpo = PRISTINE.indexOf(MARCA) + MARCA.length, fim = PRISTINE.indexOf("<\/script>", corpo);
  return PRISTINE.slice(0, corpo) + json + PRISTINE.slice(fim);
}
function dadosDoHtml(texto) {
  var i = texto.indexOf(MARCA); if (i < 0) return null;
  var c = i + MARCA.length, f = texto.indexOf("<\/script>", c);
  try { return normalizar(JSON.parse(texto.slice(c, f))); } catch (e) { return null; }
}
function nomeArquivo() { return "prancheta-OS" + String(estado.os || "").replace(/\D/g, "") + ".html"; }

// Computador: grava direto no arquivo da pasta da OS. Antes de gravar, relê o
// arquivo e junta: o que o assistente gravou nele (enquadramento, constatação
// nova) entra na tela em vez de ser apagado.
function salvarNoArquivo(comClique) {
  if (!arquivoHandle) return Promise.resolve(false);
  var pedir = comClique && arquivoHandle.requestPermission ? arquivoHandle.requestPermission({mode: "readwrite"})
    : (arquivoHandle.queryPermission ? arquivoHandle.queryPermission({mode: "readwrite"}) : Promise.resolve("granted"));
  return pedir.then(function (p) {
    arquivoPermitido = p === "granted";
    if (!arquivoPermitido) { status(); return false; }
    return arquivoHandle.getFile().then(function (f) { return f.text(); }).then(function (texto) {
      var doArquivo = texto ? dadosDoHtml(texto) : null;
      if (doArquivo && (doArquivo.os !== estado.os || doArquivo.ri !== estado.ri)) {
        toast("Esse arquivo é de outra OS. Nada foi gravado nele.", 5000); arquivoHandle = null; arquivoPermitido = false; status(); return false;
      }
      if (doArquivo) {
        var junto = mesclar(estado, doArquivo);
        if (!iguais(junto, estado)) { var abertos = {}; estado.itens.forEach(function (i) { if (i._aberto) abertos[i.id] = 1; });
          junto.itens.forEach(function (i) { if (abertos[i.id]) i._aberto = true; });
          estado = junto; if (!document.activeElement || document.activeElement.tagName === "BODY") render(); }
        if (!alteradoDepoisDeSalvar && iguais(estado, doArquivo)) {   // nada novo dos dois lados
          salvoNoArquivoEm = salvoNoArquivoEm || new Date(); status(); return true; }
      }
      return arquivoHandle.createWritable().then(function (w) {
        return w.write(htmlCom(estado)).then(function () { return w.close(); });
      }).then(function () {
        salvoNoArquivoEm = new Date(); alteradoDepoisDeSalvar = false; gravarNoAparelho(); status(); return true;
      });
    });
  }).catch(function (e) { toast("Não consegui gravar no arquivo (" + (e && (e.name || e.message) || "erro") + "). Tente de novo.", 6000); return false; });
}
function escolherArquivo() {
  return window.showSaveFilePicker({suggestedName: nomeArquivo(),
    types: [{description: "Prancheta", accept: {"text/html": [".html"]}}]}).then(function (h) {
    arquivoHandle = h; arquivoPermitido = true;
    idbPut("arquivo|" + chave(), h).catch(function () {});
    return salvarNoArquivo(false);
  }).catch(function (e) { if (!e || e.name !== "AbortError") toast("Não consegui abrir o arquivo para gravar.", 4000); });
}
// Celular: compartilhar (OneDrive) ou baixar.
function exportar() {
  var arq = new File([htmlCom(estado)], nomeArquivo(), {type: "text/html"});
  var concluir = function () { exportadoEm = new Date(); alteradoDepoisDeSalvar = false; status(); };
  if (navigator.canShare && navigator.share) {
    try {
      if (navigator.canShare({files: [arq]})) {
        navigator.share({files: [arq], title: arq.name}).then(concluir).catch(function (e) {
          if (!e || e.name !== "AbortError") baixar(arq, concluir); });
        return;
      }
    } catch (e) {}
  }
  baixar(arq, concluir);
}
function baixar(arq, concluir) {
  var a = document.createElement("a"); a.href = URL.createObjectURL(arq); a.download = arq.name;
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
  concluir(); toast("Arquivo salvo em Downloads: " + arq.name, 4000);
}
document.getElementById("btn-salvar").addEventListener("click", function () {
  if (!PODE_GRAVAR_DIRETO) { exportar(); return; }
  if (arquivoHandle) salvarNoArquivo(true).then(function (ok) { if (ok) toast("Salvo no arquivo da pasta da OS."); else if (!arquivoHandle) escolherArquivo(); });
  else escolherArquivo();
});
// Ao voltar para a janela no computador, relê o arquivo (o assistente pode ter gravado nele).
window.addEventListener("focus", function () { if (PODE_GRAVAR_DIRETO && arquivoHandle && arquivoPermitido && !alteradoDepoisDeSalvar) salvarNoArquivo(false); });

// Sincronizar (TESTE no celular): lê o arquivo da pasta da OS no OneDrive, junta
// com o celular (o mais novo de cada item) e grava de volta, num toque. É a
// mesma gravação direta que o computador usa. Cada falha diz onde parou, para
// a AFT contar ao assistente.
function sincronizar() {
  if (typeof window.showOpenFilePicker !== "function") {
    toast("Teste: este celular NÃO permite sincronizar direto (sem acesso a arquivo). Use Exportar.", 7000); return; }
  var escolher = arquivoHandle ? Promise.resolve(arquivoHandle) :
    window.showOpenFilePicker({multiple: false, types: [{description: "Prancheta", accept: {"text/html": [".html", ".htm"]}}]})
      .then(function (hs) { return hs[0]; });
  var etapa = "escolher o arquivo";
  escolher.then(function (hd) {
    arquivoHandle = hd; etapa = "pedir permissão de gravação";
    var p = hd.requestPermission ? hd.requestPermission({mode: "readwrite"}) : Promise.resolve("granted");
    return p.then(function (st) {
      arquivoPermitido = st === "granted";
      if (!arquivoPermitido) { arquivoHandle = null;
        toast("Teste: sem permissão para gravar nesse arquivo. Toque de novo em Sincronizar e permita.", 6000); return false; }
      idbPut("arquivo|" + chave(), hd).catch(function () {});
      etapa = "ler e gravar o arquivo";
      return salvarNoArquivo(false);
    });
  }).then(function (ok) {
    if (ok) { exportadoEm = new Date(); alteradoDepoisDeSalvar = false; status();
      toast("✓ Sincronizado com o arquivo da pasta da OS às " + hhmm(new Date()) + ".", 4500); }
    else if (ok === false) arquivoHandle = arquivoPermitido ? arquivoHandle : null;
  }).catch(function (e) {
    if (e && e.name === "AbortError") return;
    arquivoHandle = null;
    toast("Teste: parou ao " + etapa + " (" + (e && (e.name || e.message) || "erro") + "). Use Exportar e me conte esta mensagem.", 9000);
  });
}
if (SINCRONIA_CELULAR) {
  document.getElementById("btn-sincronizar").hidden = false;
  document.getElementById("btn-sincronizar").addEventListener("click", sincronizar);
}

// ------------------------------------------------------------ partida
// Junta o que está no arquivo com o que estava guardado neste aparelho.
idbGet(chave()).then(function (guardado) {
  if (guardado) {
    var junto = mesclar(estado, normalizar(guardado));
    if (!iguais(junto, estado)) {
      estado = junto;
      estado._aviso = "Juntei o arquivo com o que estava guardado neste aparelho (" + hhmm(new Date(ts(guardado.salvo_em) || Date.now())) + "). "
        + (PODE_GRAVAR_DIRETO ? "Clique em Salvar arquivo para levar tudo à pasta da OS." : "Salve o arquivo para levar essas mudanças à pasta da OS.");
      alteradoDepoisDeSalvar = true;
    }
    gravadoEm = guardado.salvo_em ? new Date(ts(guardado.salvo_em)) : null;
  }
  guardaAparelho = "idb";
  return (PODE_GRAVAR_DIRETO || SINCRONIA_CELULAR) ? idbGet("arquivo|" + chave()).then(function (h) {
    if (h) { arquivoHandle = h; return h.queryPermission({mode: "readwrite"}).then(function (p) { arquivoPermitido = p === "granted"; }); }
  }).catch(function () {}) : null;
}).catch(function () {
  try { localStorage.setItem("prancheta-teste", "1"); localStorage.removeItem("prancheta-teste"); guardaAparelho = "local"; }
  catch (e) { guardaAparelho = "nenhum"; }
}).then(render);

// Acesso de conferência (usado nos testes da skill; não muda nada sozinho).
window.__prancheta = {estado: function () { return estado; }, carimbar: carimbar, htmlCom: htmlCom,
  mesclar: mesclar, dadosDoHtml: dadosDoHtml,
  adicionarFoto: function (id, arquivo) { var it = item(id);
    return adicionarFoto(it, arquivo).then(function () { mudou(it); render(); }); }};
})();
</script>
